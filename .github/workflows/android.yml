name: Android CI

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: "platforms;android-37.0"
  ANDROID_BUILD_TOOLS: "build-tools;36.1.0"
  ANDROID_NDK: "ndk;30.0.16248370"
  ANDROID_CMAKE: "cmake;4.1.2"

jobs:
  build:
    name: Lint, unit tests & APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" "$ANDROID_NDK" "$ANDROID_CMAKE" "platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore (optional)
        env:
          PF_KEYSTORE_BASE64: ${{ secrets.PF_KEYSTORE_BASE64 }}
        if: env.PF_KEYSTORE_BASE64 != ''
        run: |
          echo "$PF_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PF_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug & release APKs
        env:
          PF_KEYSTORE_PASSWORD: ${{ secrets.PF_KEYSTORE_PASSWORD }}
          PF_KEY_ALIAS: ${{ secrets.PF_KEY_ALIAS }}
          PF_KEY_PASSWORD: ${{ secrets.PF_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Report signing
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME"/build-tools/36.1.0/apksigner verify --print-certs "$APK" | head -5 || true
          if [ -z "${PF_KEYSTORE_PATH:-}" ]; then echo "::notice::No release keystore secret configured — release APK is signed with the debug key (test builds only)."; fi

      - uses: actions/upload-artifact@v7
        with:
          name: pixelforge-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: pixelforge-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true

  instrumented:
    name: Instrumentation tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" "$ANDROID_NDK" "$ANDROID_CMAKE"

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumentation-reports
          path: app/build/reports/androidTests/
